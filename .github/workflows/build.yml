name: Build Fabric Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle wrapper
        id: find_project
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort

          GRADLEW_PATH=$(find . -maxdepth 5 -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: Could not find gradlew."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found Gradle project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Make Gradle wrapper executable
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: chmod +x ./gradlew

      - name: Build
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: ./gradlew build --stacktrace

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: tickrateapi-fabric-jars
          path: "**/build/libs/*.jar"
